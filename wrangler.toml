# Cloudflare Pages 项目配置
# 项目名来自上线地址 favor-dke.pages.dev → favor-dke
#
# 部署命令（在 site/ 目录下执行）：
#   wrangler pages deploy .
#
# 首次使用需先登录：
#   wrangler login          （本机有浏览器时，走 OAuth）
#   或设置环境变量 CLOUDFLARE_API_TOKEN=<token>  （适合无浏览器环境）
name = "favor"
compatibility_date = "2025-07-01"
# 本目录即静态站根目录，无构建步骤
pages_build_output_dir = "."
